<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目成员 - CampusERP</title>
    <link rel="stylesheet" href="member.css">
</head>
<body>

<header class="topbar">
    <div class="brand">
        <span class="brand-mark">C</span>
        <span class="brand-name">CampusERP</span>
    </div>

    <div class="topbar-info">
        <span class="project-tag" id="projectName">科研经费A</span>
        <span class="user">
            <span class="avatar" id="userAvatar">林</span>
            <span id="userName">小林</span>
            <span class="role-badge">成员</span>
        </span>
        <button class="btn btn-ghost" id="logoutBtn" type="button">退出</button>
    </div>
</header>

<main class="container">
    <div class="page-head">
        <div>
            <h1>项目经费</h1>
            <p class="subtitle">总预算 = 可用 + 冻结 + 已使用</p>
        </div>
        <span class="demo-badge" title="当前为界面演示数据，尚未连接后端">演示数据</span>
    </div>

    <section class="budget-grid">
        <article class="budget-card">
            <p class="budget-label">总预算</p>
            <p class="budget-value" id="totalBudget">--</p>
        </article>
        <article class="budget-card card-available">
            <p class="budget-label">可用</p>
            <p class="budget-value" id="availableBudget">--</p>
        </article>
        <article class="budget-card card-frozen">
            <p class="budget-label">冻结</p>
            <p class="budget-value" id="frozenBudget">--</p>
        </article>
        <article class="budget-card card-used">
            <p class="budget-label">已使用</p>
            <p class="budget-value" id="usedBudget">--</p>
        </article>
    </section>

    <div class="budget-bar" aria-hidden="true">
        <span class="bar-available" id="barAvailable"></span>
        <span class="bar-frozen" id="barFrozen"></span>
        <span class="bar-used" id="barUsed"></span>
    </div>

    <section class="panel">
        <div class="panel-head">
            <h2>我的申请</h2>
            <button class="btn btn-primary" id="newAppBtn" type="button">+ 新建申请</button>
        </div>

        <div class="table-wrap">
            <table class="app-table">
                <thead>
                <tr>
                    <th>编号</th>
                    <th>用途</th>
                    <th class="num">申请金额</th>
                    <th class="num">批准金额</th>
                    <th class="num">实际花费</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="appTableBody"></tbody>
            </table>
        </div>

        <div class="empty" id="emptyState" hidden>
            还没有申请，点击右上角「新建申请」开始。
        </div>
    </section>
</main>

<!-- 新建 / 编辑申请弹窗 -->
<div class="modal-mask" id="appModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h3 id="modalTitle">新建申请</h3>

        <form id="appForm" novalidate>
            <div class="field">
                <label for="purposeInput">用途</label>
                <textarea id="purposeInput" rows="3" maxlength="100"
                          placeholder="例如：采购传感器"></textarea>
            </div>

            <div class="field">
                <label for="amountInput">金额（元）</label>
                <input id="amountInput" type="text" inputmode="decimal"
                       placeholder="例如：600.00">
                <p class="hint">最多两位小数，金额必须大于 0。</p>
            </div>

            <p class="form-error" id="formError" role="alert"></p>

            <div class="modal-actions">
                <button class="btn btn-ghost" id="cancelBtn" type="button">取消</button>
                <button class="btn btn-primary" id="saveBtn" type="submit">保存草稿</button>
            </div>
        </form>
    </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="member.js"></script>
</body>
</html>
